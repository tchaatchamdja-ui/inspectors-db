<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E8B57"/>
      <stop offset="100%" stop-color="#1B6B3A"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E5CB3"/>
      <stop offset="100%" stop-color="#0D3B7A"/>
    </linearGradient>
  </defs>

  <!-- Globe / Head -->
  <ellipse cx="150" cy="80" rx="52" ry="52" fill="none" stroke="#1E5CB3" stroke-width="3"/>
  <!-- Yellow top half -->
  <path d="M98 80 A52 52 0 0 1 202 80 Z" fill="#F5C518"/>
  <!-- Blue-green bottom half -->
  <path d="M98 80 A52 52 0 0 0 202 80 Z" fill="#4CB8D6"/>
  <!-- Horizon line -->
  <line x1="98" y1="80" x2="202" y2="80" stroke="#1E5CB3" stroke-width="1.5"/>

  <!-- Left arm (green ribbon) going up and right -->
  <path d="M120 130 C100 160, 80 180, 100 210 C120 240, 160 220, 150 250 C140 280, 100 300, 80 330 C60 350, 40 360, 20 370"
        fill="none" stroke="url(#greenGrad)" stroke-width="18" stroke-linecap="round"/>

  <!-- Right arm (blue ribbon) going up and left -->
  <path d="M180 130 C200 160, 220 180, 200 210 C180 240, 140 220, 150 250 C160 280, 200 300, 220 330 C240 350, 260 360, 280 370"
        fill="none" stroke="url(#blueGrad)" stroke-width="18" stroke-linecap="round"/>

  <!-- Intertwined section - green over blue at top -->
  <path d="M135 195 C145 205, 155 205, 165 195"
        fill="none" stroke="url(#greenGrad)" stroke-width="16" stroke-linecap="round"/>

  <!-- Bottom spread - green lines -->
  <path d="M80 330 L50 370" fill="none" stroke="#2E8B57" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <path d="M80 330 L70 375" fill="none" stroke="#2E8B57" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <path d="M80 330 L90 375" fill="none" stroke="#2E8B57" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- Bottom spread - blue lines -->
  <path d="M220 330 L250 370" fill="none" stroke="#1E5CB3" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <path d="M220 330 L230 375" fill="none" stroke="#1E5CB3" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <path d="M220 330 L210 375" fill="none" stroke="#1E5CB3" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- Additional green spread -->
  <path d="M80 330 L30 365" fill="none" stroke="#2E8B57" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Additional blue spread -->
  <path d="M220 330 L270 365" fill="none" stroke="#1E5CB3" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- UEMOA text -->
  <text x="150" y="398" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="bold" fill="#1E5CB3" letter-spacing="4">UEMOA</text>
</svg>