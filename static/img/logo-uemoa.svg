<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" width="240" height="340">
  <defs>
    <clipPath id="globeTop">
      <rect x="80" y="20" width="80" height="40"/>
    </clipPath>
    <clipPath id="globeBottom">
      <rect x="80" y="60" width="80" height="40"/>
    </clipPath>
  </defs>

  <!-- ===== GLOBE ===== -->
  <!-- Yellow top half -->
  <circle cx="120" cy="60" r="38" clip-path="url(#globeTop)" fill="#F0C420"/>
  <!-- Cyan bottom half -->
  <circle cx="120" cy="60" r="38" clip-path="url(#globeBottom)" fill="#4DC8E8"/>
  <!-- Globe outline -->
  <circle cx="120" cy="60" r="38" fill="none" stroke="#1B6B3A" stroke-width="2.5"/>
  <!-- Equator line -->
  <ellipse cx="120" cy="62" rx="36" ry="4" fill="none" stroke="#1B6B3A" stroke-width="1.2" opacity="0.5"/>

  <!-- ===== GREEN RIBBON (left side) ===== -->
  <!-- Main green ribbon - starts from top-left of globe, curves down -->
  <path d="
    M 102 92
    C 85 115, 72 135, 78 160
    C 84 185, 115 190, 125 210
    C 135 230, 118 250, 105 268
    C 92 286, 75 295, 55 310
  " fill="none" stroke="#1B8C3D" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Green ribbon overlay for crossing effect (green goes OVER blue at top crossing) -->
  <path d="
    M 102 92
    C 90 108, 80 125, 78 140
  " fill="none" stroke="#1B8C3D" stroke-width="22" stroke-linecap="round"/>

  <!-- ===== BLUE RIBBON (right side) ===== -->
  <!-- Main blue ribbon - starts from top-right of globe, curves down -->
  <path d="
    M 138 92
    C 155 115, 168 135, 162 160
    C 156 185, 125 190, 115 210
    C 105 230, 122 250, 135 268
    C 148 286, 165 295, 185 310
  " fill="none" stroke="#1561A9" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Blue ribbon overlay for crossing effect (blue goes OVER green at bottom crossing) -->
  <path d="
    M 115 210
    C 105 230, 122 250, 135 268
  " fill="none" stroke="#1561A9" stroke-width="22" stroke-linecap="round"/>

  <!-- ===== GREEN at crossing top - green passes IN FRONT ===== -->
  <path d="
    M 92 130
    C 95 148, 105 162, 118 172
  " fill="none" stroke="#1B8C3D" stroke-width="20" stroke-linecap="round"/>

  <!-- ===== BOTTOM SPREAD - Green side (left) ===== -->
  <path d="M 55 310 L 30 325" fill="none" stroke="#1B8C3D" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  <path d="M 55 310 L 42 328" fill="none" stroke="#1B8C3D" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 55 310 L 55 330" fill="none" stroke="#1B8C3D" stroke-width="4.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 55 310 L 68 328" fill="none" stroke="#1B8C3D" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <path d="M 55 310 L 78 325" fill="none" stroke="#1B8C3D" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M 55 310 L 18 322" fill="none" stroke="#1B8C3D" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <!-- ===== BOTTOM SPREAD - Blue side (right) ===== -->
  <path d="M 185 310 L 210 325" fill="none" stroke="#1561A9" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  <path d="M 185 310 L 198 328" fill="none" stroke="#1561A9" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 185 310 L 185 330" fill="none" stroke="#1561A9" stroke-width="4.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 185 310 L 172 328" fill="none" stroke="#1561A9" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <path d="M 185 310 L 162 325" fill="none" stroke="#1561A9" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M 185 310 L 222 322" fill="none" stroke="#1561A9" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <!-- ===== UEMOA TEXT ===== -->
  <text x="120" y="338" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="36" font-weight="900" fill="#1561A9" letter-spacing="5">UEMOA</text>
</svg>